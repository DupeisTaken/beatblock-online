[package]
name = "beatblock-together-companion"
version = "0.1.0-alpha.1"
edition = "2021"
description = "Local bridge, OBS API, and remote gateway for Beatblock Together"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
futures-util = "0.3"
hex = "0.4"
keyring = { version = "3.6", features = ["windows-native"] }
open = "5.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.46", features = ["full"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-native-roots"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
walkdir = "2.5"
zip = "4.3"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader"] }

[package.metadata.wix]
upgrade-guid = "7F621E20-7DBB-4B8A-89E6-24D348ED1270"
path-guid = "752B342D-C4D2-43FD-B6B8-B8FD168213A2"
license = false
eula = false

[[bench]]
name = "companion_bench"
harness = false
