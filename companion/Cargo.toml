[package]
name = "beatblock-online-companion"
version = "0.3.0-beta.4"
edition = "2021"
description = "Installer and hidden direct-room runtime for Beatblock Online"
license = "MIT"

[features]
default = []
installer-ui = ["dep:slint", "dep:rfd"]

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
igd-next = { version = "0.17.1", features = ["aio_tokio"] }
keyring = { version = "3.6", features = ["windows-native"] }
local-ip-address = "0.6"
memmap2 = "0.9"
open = "5.3"
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.9"
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = { version = "0.15", optional = true }
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = "0.10"
slint = { version = "1.12", optional = true, default-features = false, features = ["backend-winit", "renderer-femtovg", "compat-1-2"] }
spake2 = "0.4"
tokio = { version = "1.46", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.17", features = ["v4", "serde"] }
walkdir = "2.5"
zip = "4.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[package.metadata.wix]
upgrade-guid = "7F621E20-7DBB-4B8A-89E6-24D348ED1270"
path-guid = "752B342D-C4D2-43FD-B6B8-B8FD168213A2"
license = false
eula = false

[[bin]]
name = "BeatblockOnlineRuntime"
path = "src/main.rs"

[[bin]]
name = "BeatblockOnlineInstaller"
path = "src/installer_main.rs"
required-features = ["installer-ui"]

[[bench]]
name = "companion_bench"
harness = false
