[manifest]
version = "1.0.0"
dump_lua = true
priority = 100

[[patches]]
[patches.module]
source = "bbt/core.lua"
before = "main.lua"
name = "bbt.core"

[[patches]]
[patches.module]
source = "bbt/dashboard_model.lua"
before = "main.lua"
name = "bbt.dashboard_model"

[[patches]]
[patches.module]
source = "bbt/dashboard_components.lua"
before = "main.lua"
name = "bbt.dashboard_components"

[[patches]]
[patches.module]
source = "bbt/online_state.lua"
before = "main.lua"
name = "bbt.online_state"

[[patches]]
[patches.module]
source = "bbt/renderer.lua"
before = "main.lua"
name = "bbt.renderer"

[[patches]]
[patches.pattern]
target = "main.lua"
# Qualify the startup initialization so the editor hotkey's cs:init() is not
# treated as a second candidate by Lovely.
pattern = "cs = bs.load(project.initState)\n\tcs:init()"
position = "after"
payload = "if BBTRenderer and BBTRenderer.active then BBTRenderer.start() end"
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "states/Game.lua"
pattern = "st:setUpdate(function(self,dt)"
position = "after"
# Let Beatblock's startPending branch finish the threaded chart preload before
# holding gameplay on the remote participant's paused state.
payload = "if BBT then BBT.update(dt) end; if BBTRenderer and BBTRenderer.active and BBTRenderer.shouldHold() and not self.startPending then return end"
match_indent = true

[[patches]]
[patches.pattern]
target = "main.lua"
# Game:update returns while a renderer is held, but Beatblock normally advances
# global eases and EntityManager immediately afterward. Keep both native systems
# on the same pause boundary so hidden shader objects and Player canvases cannot
# drift before the delayed participant stream begins.
pattern = "prof.push(\"flux update\")"
position = "before"
payload = "if not (BBTRenderer and BBTRenderer.active and BBTRenderer.shouldFreezeSimulation()) then"
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "main.lua"
pattern = "prof.pop(\"entityman update\")"
position = "after"
payload = "end"
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "states/Game.lua"
# The remote input vector is installed before entity updates. This post-manager
# hook only corrects material audio drift after Play Song has created a track.
pattern = "self.gm:update(dt)"
position = "after"
payload = "if BBTRenderer and BBTRenderer.active then BBTRenderer.afterGameUpdate() end"
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "obj/GameManager.lua"
# Beatblock assigns cBeat from its local audio track immediately before reading
# events. Replace it at that native clock boundary so blocks, taps, eases, VFX,
# and results all consume the same delayed participant sample.
pattern = "  -- read the level"
position = "before"
payload = "if BBTRenderer and BBTRenderer.active then BBTRenderer.applyClock() end"
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "obj/Player.lua"
# The transmitted paddle angle is the source Player's final native state. Apply
# it after the hidden Player's local input/cap pass and before note entities (at
# higher update layers) perform collision, avoiding a second source-angle cap.
pattern = 'prof.pop("player update")'
position = "before"
payload = "if BBTRenderer and BBTRenderer.active then BBTRenderer.applyPaddleState(self) end"
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "states/Game.lua"
pattern = "self:pauseGame()"
position = "before"
# pauseGame is the shared destination for Escape and controller pause inputs.
# Competitive sessions ignore it before Beatblock can stop the chart; offline
# play keeps the game's native pause behavior.
payload = "if BBT and BBT.shouldBlockPause() then return end"
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "states/Game.lua"
pattern = "function st:restartLevel()"
position = "after"
payload = "if BBT then BBT.onRetry() end"
match_indent = true

[[patches]]
[patches.pattern]
target = "states/Game.lua"
pattern = "function st:quitLevel()"
position = "after"
payload = "if BBT then BBT.onQuit() end"
match_indent = true

[[patches]]
[patches.pattern]
target = "states/Game.lua"
pattern = "function st:goToResults(forceScore,scoreMax,fadeTime)"
position = "after"
payload = "if BBT then BBT.onResults() end"
match_indent = true

[[patches]]
[patches.pattern]
target = "states/Game.lua"
pattern = "if self.pauseTimer <= 0 then"
position = "after"
payload = "if BBT and BBT.shouldHoldStart() then return end"
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "states/Game.lua"
pattern = "love.graphics.setCanvas(self.canv)"
position = "after"
payload = "if self.startPending and BBT then BBT.drawCountdown() end"
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "states/Game.lua"
pattern = "self.gm:endOnTopShader()"
position = "after"
payload = "if BBT then BBT.drawRaceHud() end"
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "main.lua"
# Gamestate:draw returns only after shuv.finish has converted raw palette-index
# colors into shuv.canvasShaded and composited every in-state HUD layer. Capture
# here before the native mouse overlay. Results uses the same final composition
# contract and must keep publishing after gameplay hands off state.
pattern = "cs:draw()"
position = "after"
payload = "if BBTRenderer and BBTRenderer.active and cs and (cs.name == 'Game' or cs.name == 'Results') then BBTRenderer.capturePlayerView(cs.canv, shuv and shuv.canvasShaded) end"
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "states/SongSelect.lua"
pattern = "function st:playLevel(filename, variant)"
position = "after"
payload = "if BBT and BBT.selectingOnlineChart then BBT.onChartSelected(self, filename, variant); return end"
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "states/SongSelect.lua"
pattern = "function st:quitToMenu()"
position = "after"
payload = "if BBT and BBT.cancelChartSelection(self) then return end"
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "states/Results.lua"
pattern = "self.options:addOption('retry',function()"
position = "after"
payload = "if BBT and BBT.shouldBlockRetry() then BBT.lastError = 'Retry is disabled while competitive Run Checks are enabled'; return end"
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "states/Menu.lua"
pattern = "self.mainMenu:addOption('credits',function()"
position = "before"
payload = '''
-- RadialList localizes option keys and substitutes a question-mark icon when
-- none is supplied. Register the label for the active language and load the
-- mod-owned globe with its Beatblock sublabel; fallback keeps the menu usable
-- if an installation is incomplete.
loc.json.bbtOnline = loc.json.bbtOnline or {}
loc.json.bbtOnline[loc.lang] = 'Online'
sprites.menu.bbtOnline = (BBT and BBT.assetImage and BBT.assetImage('assets/online.png')) or sprites.menu.fallback
self.mainMenu:addOption('bbtOnline', function()
  local bbtMenuMusicManager = self.menuMusicManager
  cs = bs.load('Online')
  bbtMenuMusicManager:clearOnBeatHooks()
  self:leave()
  cs.menuMusicManager = bbtMenuMusicManager
  cs:init()
end, 51, nil, sprites.menu.bbtOnline)
'''
match_indent = true
