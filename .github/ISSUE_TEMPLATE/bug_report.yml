name: Bug report
description: Report a reproducible problem in Beatblock Online
labels: [bug]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      description: Confirm each item before filing the report.
      options:
        - label: I tested the latest release and checked the troubleshooting guide.
          required: true
        - label: I searched open and closed issues for this problem.
          required: true
        - label: I removed private information from the report and attachments.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installer or self-update
        - Online runtime
        - Room connection or protocol
        - Charts, setlists, or results
        - Dashboard or controls
        - Broadcast, OBS, or audio
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: List the shortest steps that trigger the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: What should have happened, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      value: |
        Beatblock Online:
        Beatblock:
        Windows:
        Role (if relevant):
        OBS (if relevant):
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Optional screenshot, crash report, or short sanitized log excerpt.
