name: Beatblock build compatibility
description: Report an unverified Beatblock build or update that breaks Beatblock Online
labels: [bug, compatibility]
body:
  - type: markdown
    attributes:
      value: |
        Beatblock Online accepts newer structurally valid Beatblock builds, but they remain unverified until the exact displayed version and bracketed build token pass the compatibility suite. Use this form when an unverified build or Beatblock update breaks installation or runtime behavior. Before reporting, read the [compatibility policy](https://github.com/DupeisTaken/beatblock-online/blob/main/docs/compatibility.md).
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I reproduced this with the latest Beatblock Online release.
          required: true
        - label: I searched open and closed issues for this Beatblock build.
          required: true
        - label: I launched Beatblock once after its update and retried the installer.
          required: true
        - label: I removed passwords, tokens, usernames, and private paths from attachments.
          required: true
  - type: input
    id: online_version
    attributes:
      label: Beatblock Online version
      placeholder: v0.3.0-beta.5
    validations:
      required: true
  - type: input
    id: beatblock_version
    attributes:
      label: Exact Beatblock version and build token
      description: Copy the complete top-right value exactly, including the bracketed build token. Accepted does not mean this build has been verified.
      placeholder: 1.7.1a (Early Access)[d40b7083]
    validations:
      required: true
  - type: dropdown
    id: failure_stage
    attributes:
      label: Failure stage
      options:
        - Installer rejects, cannot locate, or marks the game incompatible
        - Installer completes but Online is missing
        - Online opens but the runtime fails
        - Same-build room join is rejected unexpectedly
        - Chart or judgement behavior differs after the update
        - Renderer or OBS integration fails after the update
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Attach the installer log, runtime log, screenshot, and the exact error. Do not upload the game executable or copyrighted game archives.
    validations:
      required: true
