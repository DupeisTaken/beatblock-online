name: Feature request
description: Suggest a new capability for Beatblock Online
labels: [feature]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the latest release and documentation.
          required: true
        - label: I searched open and closed issues for this request.
          required: true
  - type: textarea
    id: feature
    attributes:
      label: Proposed feature
      description: Describe the new capability.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: What need or use case would this feature address?
    validations:
      required: true
