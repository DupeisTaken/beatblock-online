name: Documentation change
description: Report missing, unclear, or inaccurate documentation
labels: [documentation]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the latest documentation.
          required: true
        - label: I searched open and closed issues for this documentation gap.
          required: true
  - type: input
    id: location
    attributes:
      label: Page or section
      description: Link to it or provide the repository path and heading.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing, unclear, or inaccurate?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: What should the documentation say instead?
    validations:
      required: true
