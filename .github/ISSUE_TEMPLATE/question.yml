name: Question
description: Ask a usage or development question not answered by the guides
labels: [question]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I read the relevant guides and troubleshooting sections.
          required: true
        - label: I searched open and closed issues for an answer.
          required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you need to know?
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Version or context
      description: Include the Beatblock Online version and any relevant role or guide.
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: What I tried
      description: What documentation or troubleshooting did you already try?
    validations:
      required: true
