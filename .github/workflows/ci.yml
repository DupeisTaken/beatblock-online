name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm --filter @bbt/protocol test
      - run: pnpm test:release-workflow
      - run: pnpm build:protocol
      - run: pnpm generate:protocol
      - run: git diff --exit-code -- protocol/schemas/v3/protocol.json
      - run: pnpm package:mods
      - run: pnpm test:patch-validation
      # The full mod gate remains local because it validates signatures against
      # the user's isolated, legally obtained game fixture.
      - run: pnpm test:mod:source

  companion:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: companion
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
        working-directory: companion
      - run: powershell -NoProfile -File scripts/test-release-utils.ps1
      - run: cargo fmt --manifest-path companion/Cargo.toml --check
      # These five gates require either the user's isolated game fixture or the
      # verified binary payloads built by the Release workflow. Every source-only
      # test remains blocking here.
      - run: >-
          cargo test --manifest-path companion/Cargo.toml --lib --bins --
          --skip detector_accepts_isolated_test_game_shape
          --skip embedded_obs_source_is_a_real_module_with_required_exports
          --skip full_standalone_install_repair_restore_and_uninstall_round_trip
          --skip move_installation_and_adapter_detection_are_exclusive
          --skip verified_obs_component_does_not_report_a_stale_failure
      - run: cargo test --manifest-path companion/Cargo.toml --test game_commands
      - run: cargo test --manifest-path companion/Cargo.toml --test stress --release
      - run: cargo clippy --manifest-path companion/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path companion/Cargo.toml --features installer-ui --bin BeatblockOnlineInstaller -- -D warnings
      - run: powershell -NoProfile -File scripts/test-install-mod.ps1
