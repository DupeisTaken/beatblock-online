name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-15
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm --filter @bbt/protocol test
      - run: pnpm test:release-workflow
      - run: cargo fmt --manifest-path companion/Cargo.toml --check
      - run: cargo test --manifest-path companion/Cargo.toml --lib --bins -- --skip detector_accepts_isolated_test_game_shape
      - run: cargo test --manifest-path companion/Cargo.toml --test game_commands
      - run: cargo test --manifest-path companion/Cargo.toml --test stress --release
      - run: cargo clippy --manifest-path companion/Cargo.toml -- -D warnings
      - run: powershell -NoProfile -File scripts/test-install-mod.ps1
      - run: pnpm test:patch-validation
      # GitHub-hosted release builds validate the distributable source tree.
      # Full signature acceptance remains a local, fixture-backed gate.
      - run: pnpm test:mod:source
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: beatblock-together-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/BeatblockTogetherInstaller.exe
            release/SHA256SUMS.txt
            artifacts/obs/beatblock-together-obs.dll
            mod/releases/*.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            'release/BeatblockTogetherInstaller.exe#Windows self-contained installer'
            'release/SHA256SUMS.txt#SHA-256 checksums'
            'artifacts/obs/beatblock-together-obs.dll#OBS 32 x64 source plugin'
          )
          $assets += Get-ChildItem 'mod/releases/*.zip' | ForEach-Object { $_.FullName }
          $arguments = @(
            'release', 'create', $env:GITHUB_REF_NAME
            '--verify-tag'
            '--generate-notes'
          ) + $assets
          if ($env:GITHUB_REF_NAME -match '-') { $arguments += '--prerelease' }
          gh @arguments
